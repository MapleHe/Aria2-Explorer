name: Release Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'firefox-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Create zip package
        run: |
          mkdir -p dist
          zip -r dist/aria2-explorer-firefox.xpi \
            acknowledgment.txt \
            aria2.html \
            background.js \
            FlowChart-CN.SVG \
            images \
            LICENSE \
            magnet.html \
            README.cn.md \
            ui \
            background.html \
            css \
            FlowChart-EN.SVG \
            js \
            _locales \
            manifest.json \
            options.html \
            README.md

      - name: Publish GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/aria2-explorer-firefox.xpi
